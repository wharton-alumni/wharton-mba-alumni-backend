spring.application.name=wharton-mba-alumni-backend
server.port=${PORT:8080}
spring.jackson.default-property-inclusion=non_null

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:wharton_alumni;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:https://WhartonEMBA.com,https://www.WhartonEMBA.com,http://localhost:5173,http://127.0.0.1:5173}
app.seed.enabled=${SEED_DATA_ENABLED:false}
app.biobook.seed.enabled=${BIOBOOK_SEED_ENABLED:false}
app.auth.jwt-secret=${JWT_SECRET:change-this-local-development-secret-at-least-32-bytes}
app.auth.jwt-ttl-minutes=${JWT_TTL_MINUTES:1440}
app.auth.reset-token-ttl-minutes=${RESET_TOKEN_TTL_MINUTES:30}
app.auth.verification-code-ttl-minutes=${VERIFICATION_CODE_TTL_MINUTES:10}
app.auth.expose-dev-code=${APP_EXPOSE_DEV_CODE:false}

spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.connectiontimeout=${SMTP_CONNECTION_TIMEOUT_MS:10000}
spring.mail.properties.mail.smtp.timeout=${SMTP_TIMEOUT_MS:10000}
spring.mail.properties.mail.smtp.writetimeout=${SMTP_WRITE_TIMEOUT_MS:10000}

app.mail.enabled=${SMTP_ENABLED:false}
app.mail.from=${SMTP_FROM:}
